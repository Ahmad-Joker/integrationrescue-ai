name: CI

# Offline and deterministic: no job calls a paid or private model API, and no job reads repository secrets.
# Live-model evaluation is run by hand (see docs/LIVE_DEMO_RUNBOOK.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint, tests, security policy, eval smoke, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IR_SKIP_DOTENV: "1"
      IR_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e "backend[dev]" pip-audit
      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check backend
          .venv/bin/ruff check scripts --config backend/pyproject.toml
      - name: Security-policy and prompt-injection tests
        working-directory: backend
        run: ../.venv/bin/python -m pytest tests/adversarial tests/unit/test_policy.py tests/unit/test_edit_schema.py -o addopts="" -q -rf
      - name: Full test suite (unit, integration, adversarial, API, demo mode)
        working-directory: backend
        run: ../.venv/bin/python -m pytest -o addopts="-p no:cacheprovider" -q -rf --durations=5
      - name: Deterministic evaluation smoke test (baseline, not an LLM)
        working-directory: backend
        env:
          IR_VAR_DIR: ${{ runner.temp }}/ir-eval
        run: ../.venv/bin/python -m integrationrescue.evaluation --seeds 101
      - name: Dependency audit (Python)
        run: .venv/bin/pip-audit --skip-editable

  frontend:
    name: Frontend (lint, type-check, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IR_SKIP_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e backend
          npm ci --prefix frontend
      - name: Lint (oxlint)
        run: npm run lint --prefix frontend
      - name: Type-check and production build
        run: npm run build --prefix frontend
      # Shipped code (runtime dependencies) must have no high advisories. Build tooling is audited at "critical":
      # picomatch (used by Vite at build time) has a high ReDoS advisory with no fixed release yet; it only ever
      # matches glob patterns from this repository's own config, never user input. Revisit when a fix ships.
      - name: Dependency audit (runtime deps, high)
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Dependency audit (build tooling, critical)
        run: npm audit --prefix frontend --audit-level=critical
      - name: Browser tests (Playwright)
        working-directory: frontend
        env:
          CI: "1"
          IR_E2E_VAR_DIR: ${{ runner.temp }}/ir-e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  container:
    name: Container (build image, run judge demo, verify end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t integrationrescue:ci .
      - name: Refuse to start in demo mode without an access code
        run: |
          if docker run --rm -e IR_ACCESS_TOKEN= integrationrescue:ci python -c "import integrationrescue.api"; then
            echo "expected a configuration error"; exit 1
          fi
      - name: Generate throwaway access codes (deterministic run, no model key)
        run: |
          for name in IR_ACCESS_TOKEN IR_ADMIN_TOKEN; do
            value=$(openssl rand -hex 16); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start container and wait for health
        run: |
          docker run -d --name ir -p 8000:8000 -e IR_ACCESS_TOKEN -e IR_ADMIN_TOKEN integrationrescue:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          docker logs ir; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify judge flow (incident, agent run, human approval, independent verification, safe failure)
        run: |
          python -m pip install --quiet httpx
          python scripts/verify_deployment.py --url http://127.0.0.1:8000 --provider deterministic --timeout 300
      - name: Container logs
        if: always()
        run: docker logs ir 2>&1 | tail -n 100
