name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e "backend[dev]" pip-audit
      - name: Lint
        run: .venv/bin/ruff check backend
      - name: Unit, integration and adversarial tests (offline, deterministic)
        working-directory: backend
        run: ../.venv/bin/python -m pytest
      - name: Deterministic evaluation suite
        working-directory: backend
        env:
          IR_VAR_DIR: ${{ runner.temp }}/ir-eval
        run: ../.venv/bin/python -m integrationrescue.evaluation --seeds 101
      - name: Dependency audit
        run: .venv/bin/pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e backend
          npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Type-check and build
        run: npm run build --prefix frontend
      - name: Dependency audit
        run: npm audit --prefix frontend --audit-level=high
      - name: Browser tests
        working-directory: frontend
        env:
          CI: "1"
          IR_E2E_VAR_DIR: ${{ runner.temp }}/ir-e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
