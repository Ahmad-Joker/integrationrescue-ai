# Render Blueprint for the competition demo (single Docker web service).
# Secrets are declared with sync: false, so Render asks for them in the dashboard; they never live in git.
# State is ephemeral by design: incidents are fictional and the demo re-seeds itself after a restart.
services:
  - type: web
    name: integrationrescue-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # no cost; sleeps when idle (first load can take about a minute). A paid plan avoids
                             # sleeping but is a founder spending decision, see competition/USER_ACTIONS.md
    healthCheckPath: /api/health
    autoDeploy: false        # deploy deliberately, after CI is green
    envVars:
      - key: IR_DEMO_MODE
        value: "1"
      - key: IR_TRUST_PROXY
        value: "1"           # Render's proxy sets X-Forwarded-For; needed for per-client rate limits
      - key: IR_PROVIDER
        value: gemini
      - key: IR_GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: IR_MAX_LLM_CALLS
        value: "30"
      - key: IR_MAX_LIVE_INCIDENTS_PER_DAY
        value: "15"
      - key: IR_MAX_CONCURRENT_RUNS
        value: "3"
      - key: IR_RATE_LIMIT_PER_MIN
        value: "30"
      - key: IR_ACCESS_TOKEN
        sync: false
      - key: IR_ADMIN_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
